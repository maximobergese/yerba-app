<body>

<div id="barraAdmin"></div>

<div class="topbar">
  <div class="topbar-inner">
    <p class="eyebrow">Ronda de yerbas</p>
    <h1>¿Qué estás tomando?</h1>
    <p class="subtitulo">Un lugar para contar qué yerba te gustó, cuál no, y por qué. Sin vueltas, sin registro.</p>
  </div>
</div>

<div class="contenedor">

  <div class="tarjeta-form">
    <h2>Dejá tu opinión</h2>
    <form id="formOpinion">
      <div class="fila">
        <div>
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" maxlength="60" placeholder='o ingresá "Anónimo"' required>
        </div>
        <div>
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" maxlength="60" placeholder= '"en caso de Anónimo ingresar un punto ."' required>
        </div>
      </div>

      <div class="fila">
        <div>
          <label for="ubicacion">Ubicación</label>
          <input type="text" id="ubicacion" maxlength="80" placeholder="Ciudad, provincia, país" required>
        </div>
        <div>
          <label for="marca">Marca de yerba (y variedad Ej: Suave)</label>
          <input type="text" id="marca" maxlength="60" placeholder="Ej: Playadito" required>
        </div>
      </div>

      <label>Puntaje</label>
      <div class="estrellas-input" id="estrellasInput">
        <button type="button" class="estrella-btn" data-valor="1">★</button>
        <button type="button" class="estrella-btn" data-valor="2">★</button>
        <button type="button" class="estrella-btn" data-valor="3">★</button>
        <button type="button" class="estrella-btn" data-valor="4">★</button>
        <button type="button" class="estrella-btn" data-valor="5">★</button>
      </div>
      <p class="ayuda" id="ayudaEstrellas">Tocá una estrella para puntuar</p>

      <label for="opinionTexto">Tu opinión</label>
      <textarea id="opinionTexto" maxlength="600" placeholder="Contanos cómo es el sabor, si es suave o fuerte, si la volverías a comprar..." required></textarea>

      <button type="submit" class="btn-enviar" id="btnEnviar">Publicar opinión</button>
      <p class="mensaje-estado" id="mensajeEstado"></p>
    </form>
  </div>

  <div class="separador"><span>Lo que dice la gente</span></div>
  <p class="contador" id="contador"></p>

  <div id="listaOpiniones">
    <div class="cargando">Cargando opiniones...</div>
  </div>

  <div class="pie-admin">
    <button class="link-admin" id="btnAbrirAdmin">·</button>
  </div>

</div>
